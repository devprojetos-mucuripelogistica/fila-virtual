<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Fila de Atendimento · Mucuripe</title>
<meta name="description" content="Fila virtual de atendimento dos motoristas · Mucuripe Logística">
<meta name="theme-color" content="#0B3D61">
<link rel="icon" type="image/png" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fila Mucuripe">
<script>
  /* =====================================================================
   * ÚNICA COISA PARA PREENCHER:
   * cole entre as aspas o link do app que o Apps Script mostra em
   * Implantar › Gerenciar implantações (termina em /exec).
   * ===================================================================== */
  var URL_DO_APP = 'https://script.google.com/macros/s/AKfycbzv49JMTVAkvVb44twxKFXkK4XZumUO_DRfDAp1mdirEA5aDTdHKICsEqrSs0guQU218A/exec';
</script>
<style>
  html,body{margin:0;height:100%;background:#0B3D61;font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#F2F4F7;opacity:0;transition:opacity .35s}
  #app.pronto{opacity:1}
  #abre{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:#fff;text-align:center;padding:24px;
    background:radial-gradient(circle at 50% 45%,#14588C 0%,#0B3D61 60%,#082C47 100%);transition:opacity .4s}
  #abre.some{opacity:0;pointer-events:none}
  #abre img{width:96px;height:96px;border-radius:24px;box-shadow:0 18px 50px rgba(0,0,0,.35);animation:pulsa 1.6s ease-in-out infinite}
  #abre h1{margin:0;font-size:22px;font-weight:900;font-style:italic;letter-spacing:.02em;text-transform:uppercase}
  #abre h1 b{color:#C1CA4B}
  #abre p{margin:0;font-size:13px;opacity:.75;letter-spacing:.12em;text-transform:uppercase}
  .barra{width:160px;height:4px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}
  .barra i{display:block;width:40%;height:100%;background:#C1CA4B;border-radius:4px;animation:corre 1.1s ease-in-out infinite}
  #ajuda{display:none;max-width:420px;font-size:14px;line-height:1.5;opacity:.9}
  #ajuda a{color:#C1CA4B;font-weight:700}
  @keyframes pulsa{50%{transform:scale(1.06)}}
  @keyframes corre{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
</style>
</head>
<body>
  <div id="abre">
    <img src="icone-192.png" alt="">
    <h1>Fila de <b>Atendimento</b></h1>
    <div class="barra"><i></i></div>
    <p>Mucuripe Logística</p>
    <div id="ajuda"></div>
  </div>
  <iframe id="app" title="Fila de Atendimento" allow="geolocation *; clipboard-write; fullscreen; camera"></iframe>
<script>
  (function () {
    var quadro = document.getElementById('app');
    var abre = document.getElementById('abre');
    var ajuda = document.getElementById('ajuda');
    var configurado = /^https:\/\/script\.google\.com\/.+\/exec/.test(URL_DO_APP);

    if (!configurado) {
      ajuda.style.display = 'block';
      ajuda.innerHTML = 'Falta colar o link do app no arquivo <b>index.html</b> (linha <b>URL_DO_APP</b>).<br>Veja o passo a passo em docs/COMO_USAR_O_GITHUB.md.';
      document.querySelector('.barra').style.display = 'none';
      return;
    }

    function carregar() {
      var sep = URL_DO_APP.indexOf('?') > -1 ? '&' : '?';
      quadro.classList.remove('pronto');
      abre.classList.remove('some');
      quadro.src = URL_DO_APP + sep + 'casca=1&t=' + Date.now();
    }
    quadro.addEventListener('load', function () {
      quadro.classList.add('pronto');
      setTimeout(function () { abre.classList.add('some'); }, 150);
    });
    // o app pede para recarregar quando sai uma versão nova
    window.addEventListener('message', function (ev) {
      if (ev.data && ev.data.fv === 'recarregar') carregar();
    });
    // internet lenta: oferece abrir direto
    setTimeout(function () {
      if (!quadro.classList.contains('pronto')) {
        ajuda.style.display = 'block';
        ajuda.innerHTML = 'Está demorando? <a href="' + URL_DO_APP + '">Abrir o app direto</a>';
      }
    }, 15000);
    carregar();
  })();
</script>
</body>
</html>
