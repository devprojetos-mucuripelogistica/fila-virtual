    let pos = [isNaN(cfg.lat) ? -3.1190275 : cfg.lat, isNaN(cfg.lng) ? -60.0217314 : cfg.lng];
    c.innerHTML = '<div class="grade2" style="grid-template-columns:2fr 1fr;align-items:start" id="locGrade">' +
      '<div class="card"><div class="card-cab"><div><div class="card-tit">' + ic('map', 'cor-azul') + 'Configurar Localização Base</div><div class="card-sub">Clique no mapa para definir a localização da base · ou arraste o marcador</div></div>' +
      '<button class="btn btn-sm btn-contorno" id="locAqui">' + ic('crosshair', 'ic-sm') + 'Usar minha localização</button></div><div class="mapa alto" id="locMapa"></div></div>' +
      '<div class="card"><div class="card-corpo">' +
      '<div class="campo"><label>Endereço da Base</label><input class="inp" id="locEnd" value="' + esc(cfg.endereco) + '" placeholder="Digite o endereço da base"></div>' +
      '<div class="campo"><label>Raio permitido (metros)</label><input class="inp" type="number" min="50" max="10000" step="50" id="locRaio" value="' + cfg.raio + '"><span class="txt-xs txt2">Motoristas só poderão entrar na fila se estiverem dentro do raio (50 a 10.000 m)</span></div>' +
      '<input type="range" min="50" max="5000" step="50" id="locSlider" value="' + Math.min(cfg.raio, 5000) + '" style="width:100%" class="mb16">' +
      '<div class="info-box mb16"><div class="negrito txt-sm">Coordenadas</div><div class="txt-sm" id="locCoord"></div></div>' +
      '<div class="aviso aviso-info mb16 txt-sm">' + ic('lightbulb', 'ic-sm') + '<div><b>💡 Como usar:</b> clique no mapa onde fica o posto de atendimento, ajuste o raio e salve.</div></div>' +
      '<div id="locMsg" class="mb12"></div><button class="btn btn-azul btn-bloco btn-lg" id="locSalvar">' + ic('save') + 'Salvar localização</button></div></div></div>';
    icones();
    if (window.innerWidth < 900) c.querySelector('#locGrade').style.gridTemplateColumns = '1fr';
    const mapa = novoMapa(c.querySelector('#locMapa'), pos, 15);
    let mk = null, circ = null;
    const raio = function () { return Number(c.querySelector('#locRaio').value) || 0; };
    const atualizar = function () {
      c.querySelector('#locCoord').textContent = pos[0].toFixed(6) + ', ' + pos[1].toFixed(6);
      if (!mapa) return;
      if (!mk) {
        mk = L.marker(pos, { draggable: true, icon: iconeMapa('linear-gradient(135deg,#a9b23a,#8a9230)', SVG_BASE) }).addTo(mapa);
        mk.on('dragend', function () { const p = mk.getLatLng(); pos = [p.lat, p.lng]; atualizar(); });
        circ = L.circle(pos, { radius: raio(), color: '#082e4a', fillOpacity: .12 }).addTo(mapa);
      } else { mk.setLatLng(pos); circ.setLatLng(pos); circ.setRadius(raio()); }
    };
    if (mapa) mapa.on('click', function (e) { pos = [e.latlng.lat, e.latlng.lng]; atualizar(); });
    c.querySelector('#locRaio').oninput = function () { c.querySelector('#locSlider').value = Math.min(raio(), 5000); atualizar(); };
    c.querySelector('#locSlider').oninput = function () { c.querySelector('#locRaio').value = this.value; atualizar(); };
    c.querySelector('#locAqui').onclick = function () {
      if (!navigator.geolocation) return toast('GPS indisponível neste aparelho', 'erro');
      navigator.geolocation.getCurrentPosition(function (p) { pos = [p.coords.latitude, p.coords.longitude]; atualizar(); if (mapa) mapa.setView(pos, 16); },
        function () { toast('Não foi possível obter sua localização', 'erro'); }, { enableHighAccuracy: true, timeout: 10000 });
    };
    c.querySelector('#locSalvar').onclick = function () {
      const b = this; b.disabled = true;
      api('salvarLocalizacao', FV.token, { lat: pos[0], lng: pos[1], raio: raio(), endereco: c.querySelector('#locEnd').value }).then(function () {
        c.querySelector('#locMsg').innerHTML = caixaAviso('success', 'Localização salva com sucesso!');
        FV.config = Object.assign({}, FV.config, { lat: pos[0], lng: pos[1], raio: raio(), endereco: c.querySelector('#locEnd').value });
      }).catch(function (e) { c.querySelector('#locMsg').innerHTML = caixaAviso('error', e.message); })
        .then(function () { b.disabled = false; icones(); });
    };
    atualizar();
  }).catch(function (e) { if (telaAtual(tela)) falhou(c, e); });
}

/* ---------- avisos (WhatsApp / ntfy) e regras ---------- */
function telaIntegracoes(c) {
  carregando(c);
  const tela = FV.tela;
  api('getConfigAdmin', FV.token).then(function (cfg) {
    if (!telaAtual(tela)) return;
    const liga = function (id, on) { return '<label class="switch"><input type="checkbox" id="' + id + '"' + (on ? ' checked' : '') + '><span></span></label>'; };
    c.innerHTML = '<div class="grade2" style="align-items:start">' +
      '<div class="pilha"><div class="card"><div class="card-cab"><div><div class="card-tit">' + ic('message-circle', 'cor-verde') + 'WhatsApp (Evolution API)</div><div class="card-sub">Mensagem automática quando o motorista é chamado</div></div></div><div class="card-corpo">' +
      '<div class="chave-liga"><div class="negrito txt-sm">Enviar WhatsApp ao chamar</div>' + liga('iWa', cfg.whatsapp_ativo) + '</div>' +
      '<div class="campo"><label>URL da API</label><input class="inp" id="iUrl" value="' + esc(cfg.evolution_url) + '" placeholder="https://sua-evolution-api.com"></div>' +
      '<div class="campo"><label>Instância</label><input class="inp" id="iInst" value="' + esc(cfg.evolution_instance) + '" placeholder="nome-da-instancia"></div>' +
      '<div class="campo"><label>API Key</label><input class="inp" id="iKey" type="password" placeholder="' + (cfg.evolution_key_definida ? '•••••••• (já salva — deixe vazio para manter)' : 'Cole a chave da API') + '"></div>' +
      '<div class="linha"><input class="inp" id="iTel" placeholder="Telefone p/ teste (92999999999)"><button class="btn btn-contorno" id="iTestar">' + ic('send', 'ic-sm') + 'Testar</button></div></div></div>' +
      '<div class="card"><div class="card-cab"><div><div class="card-tit">' + ic('bell-ring', 'cor-ambar') + 'Alerta no celular (ntfy)</div><div class="card-sub">Gratuito. Toca no celular do motorista mesmo com o app fechado</div></div></div><div class="card-corpo">' +
      '<div class="chave-liga"><div class="negrito txt-sm">Enviar alerta ntfy ao chamar</div>' + liga('iNt', cfg.ntfy_ativo) + '</div>' +
      '<div class="campo"><label>Servidor</label><input class="inp" id="iNtS" value="' + esc(cfg.ntfy_servidor) + '"></div>' +
      '<p class="txt-xs txt2">Cada motorista tem um tópico próprio (começa com <code>' + esc(cfg.ntfy_prefixo) + '-</code>). Ele vê o tópico dele no menu do app e assina no app ntfy.</p></div></div>' +
      '<button class="btn btn-azul btn-bloco btn-lg" id="iSalvar">' + ic('save') + 'Salvar avisos</button><div id="iMsg"></div></div>' +
      '<div class="pilha"><div class="card"><div class="card-cab"><div><div class="card-tit">' + ic('sliders-horizontal', 'cor-azul') + 'Regras da fila</div></div></div><div class="card-corpo">' +
      '<div class="campo"><label>Intervalo para entrar de novo (minutos)</label><input class="inp" type="number" id="rCd" min="0" max="600" value="' + cfg.cooldown_minutos + '"><span class="txt-xs txt2">Depois de sair/ser atendido, quanto tempo esperar (era 15)</span></div>' +
      '<div class="campo"><label>Precisão mínima do GPS (metros)</label><input class="inp" type="number" id="rPr" min="10" max="1000" value="' + cfg.precisao_max_metros + '"><span class="txt-xs txt2">Se o GPS estiver pior que isso, não deixa entrar (era 50)</span></div>' +
      '<div class="campo"><label>Guardar na planilha principal (dias)</label><input class="inp" type="number" id="rDias" min="30" max="365" value="' + cfg.dias_manter + '"><span class="txt-xs txt2">O que for mais antigo vai para o Arquivo Morto todo dia às 3h (padrão: 60 = 2 meses)</span></div>' +
      '<div class="campo"><label>Ícone da aba do navegador (endereço da imagem)</label><input class="inp" id="rFav" value="' + esc(cfg.favicon_url) + '" placeholder="criado automaticamente pelo instalar"></div>' +
      '<div class="campo"><label>Logo alternativa (opcional)</label><input class="inp" id="rLogo" value="' + esc(cfg.logo_url) + '" placeholder="Deixe vazio para usar a logo da Fila de Atendimento"></div>' +
      '<button class="btn btn-azul btn-bloco" id="rSalvar">' + ic('save') + 'Salvar regras</button><div id="rMsg" class="mt12"></div></div></div>' +
      '<div class="card"><div class="card-corpo"><div class="card-tit mb8">' + ic('sheet', 'cor-verde') + 'Banco de dados</div><p class="txt-sm txt2 mb12">A planilha principal guarda só os últimos ' + cfg.dias_manter + ' dias, para o app ficar rápido. O restante fica no Arquivo Morto.</p>' +
      '<div class="linha quebra mb12"><a class="btn btn-contorno" href="' + esc(cfg.planilha_url) + '" target="_blank">' + ic('external-link', 'ic-sm') + 'Planilha principal</a>' +
      (cfg.arquivo_url ? '<a class="btn btn-contorno" href="' + esc(cfg.arquivo_url) + '" target="_blank">' + ic('archive', 'ic-sm') + 'Arquivo Morto</a>' : '') + '</div>' +
      '<p class="txt-xs txt2 mb12" id="arqInfo">' + (cfg.ultimo_arquivamento ? 'Último arquivamento: ' + fmtDataHora(cfg.ultimo_arquivamento) + resumoArquivo(cfg.ultimo_arquivamento_resumo) : 'Ainda não foi arquivado.') + '</p>' +
      '<button class="btn btn-azul" id="arqBtn">' + ic('archive', 'ic-sm') + 'Arquivar agora</button><div id="arqMsg" class="mt12"></div></div></div></div></div>';
    icones();
    const $ = function (id) { return c.querySelector('#' + id); };
    $('iSalvar').onclick = function () {
      const b = this; b.disabled = true;
      api('salvarIntegracoes', FV.token, { whatsapp_ativo: $('iWa').checked, evolution_url: $('iUrl').value, evolution_instance: $('iInst').value, evolution_key: $('iKey').value, ntfy_ativo: $('iNt').checked, ntfy_servidor: $('iNtS').value })
        .then(function () { $('iMsg').innerHTML = caixaAviso('success', 'Avisos salvos!'); $('iKey').value = ''; }).catch(function (e) { $('iMsg').innerHTML = caixaAviso('error', e.message); })
        .then(function () { b.disabled = false; icones(); });
    };
    $('iTestar').onclick = function () {
      const b = this; b.disabled = true;
      api('testarWhatsApp', FV.token, $('iTel').value).then(function () { toast('Mensagem de teste enviada', 'ok'); }).catch(erro).then(function () { b.disabled = false; });
    };
    $('rSalvar').onclick = function () {
      const b = this; b.disabled = true;
      api('salvarRegras', FV.token, { cooldown_minutos: $('rCd').value, precisao_max_metros: $('rPr').value, logo_url: $('rLogo').value, favicon_url: $('rFav').value, dias_manter: $('rDias').value })
        .then(function () { $('rMsg').innerHTML = caixaAviso('success', 'Regras salvas!'); }).catch(function (e) { $('rMsg').innerHTML = caixaAviso('error', e.message); })
        .then(function () { b.disabled = false; icones(); });
    };
    $('arqBtn').onclick = function () {
      const b = this;
      confirmar('Mover para o Arquivo Morto tudo que tiver mais de ' + $('rDias').value + ' dias? Pode levar 1 ou 2 minutos.', { titulo: 'Arquivar dados antigos', botao: 'Arquivar', icone: 'archive' }).then(function (sim) {
        if (!sim) return;
        b.disabled = true; b.innerHTML = '<span class="spinner pq branco"></span> Arquivando...';
        api('arquivarAgora', FV.token).then(function (r) {
          const tot = Object.keys(r.resumo).reduce(function (a, k) { return a + r.resumo[k]; }, 0);
          $('arqMsg').innerHTML = caixaAviso('success', tot + ' registros movidos para o Arquivo Morto.');
          $('arqInfo').textContent = 'Último arquivamento: agora' + resumoArquivo(JSON.stringify(r.resumo));
        }).catch(function (e) { $('arqMsg').innerHTML = caixaAviso('error', e.message); })
          .then(function () { b.disabled = false; b.innerHTML = ic('archive', 'ic-sm') + 'Arquivar agora'; icones(); });
      });
    };
  }).catch(function (e) { if (telaAtual(tela)) falhou(c, e); });
}
function resumoArquivo(txt) {
  try {
    const r = JSON.parse(txt || '{}'), n = Object.keys(r).filter(function (k) { return r[k]; });
    return n.length ? ' — ' + n.map(function (k) { return k + ': ' + r[k]; }).join(', ') : ' — nada a mover';
  } catch (e) { return ''; }
}

/* ---------- alterar chave ---------- */
function telaChave(c) {
  c.innerHTML = '<div class="card" style="max-width:560px;margin:auto"><div class="card-cab"><div><div class="card-tit">' + ic('key', 'cor-azul') + 'Alterar Chave de Acesso</div><div class="card-sub">Defina uma nova chave para acesso administrativo</div></div></div><div class="card-corpo"><form id="kF">' +
    '<div class="campo"><label>Nova chave</label><div class="inp-olho"><input class="inp" type="password" id="kN" placeholder="Digite a nova chave (mín. 16 caracteres)" autocomplete="new-password"><button type="button" class="btn btn-ico" id="kOlho">' + ic('eye') + '</button></div></div>' +
    '<div class="campo"><label>Confirmar chave</label><input class="inp" type="password" id="kC" placeholder="Digite a chave novamente" autocomplete="new-password"></div>' +
    '<div class="aviso aviso-alerta mb16 txt-sm">' + ic('alert-triangle', 'ic-sm') + '<div><b>Atenção:</b> A chave deve ter no mínimo 16 caracteres. Guarde-a em local seguro, pois será necessária para acessar o painel administrativo. Outros aparelhos logados como admin vão precisar entrar de novo.</div></div>' +
    '<div id="kMsg" class="mb12"></div><button class="btn btn-azul btn-bloco btn-lg" id="kBtn">' + ic('key') + 'Alterar Chave</button></form></div></div>';
  icones();
  c.querySelector('#kOlho').onclick = function () { ['kN', 'kC'].forEach(function (id) { const i = c.querySelector('#' + id); i.type = i.type === 'password' ? 'text' : 'password'; }); };
  c.querySelector('#kF').onsubmit = function (e) {
    e.preventDefault();
    const b = c.querySelector('#kBtn'); b.disabled = true;
    api('alterarChave', FV.token, c.querySelector('#kN').value, c.querySelector('#kC').value).then(function (r) {
      FV.token = r.token; LS.set('fv_token', r.token);
      c.querySelector('#kMsg').innerHTML = caixaAviso('success', 'Chave alterada com sucesso!');
      c.querySelector('#kF').reset();
    }).catch(function (er) { c.querySelector('#kMsg').innerHTML = caixaAviso('error', er.message); })
      .then(function () { b.disabled = false; icones(); });
  };
}

iniciarApp();
</script>
