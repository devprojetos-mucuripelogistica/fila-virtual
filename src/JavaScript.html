/* ============================================================

   ============================================================ */
/* ================== FUNÇÕES COMUNS ================== */
const FV = { token: null, tipo: null, config: {}, timers: [], tela: 0, offset: 0, rttMin: Infinity };
/* ---------- RELÓGIO INTERNO ----------
 * A hora oficial vem do servidor do Google (fuso de Manaus). Toda resposta traz a hora certa;
 * o app guarda a diferença para o relógio do aparelho e usa SEMPRE a hora do servidor,
 * mesmo que o celular do motorista esteja com a hora ou o fuso errados. */
function agora() { return Date.now() + (FV.offset || 0); }
function ajustarRelogio(tServidor, ida, volta) {
  if (!tServidor) return;
  const rtt = volta - ida;
  // usa a resposta mais rápida (mais precisa); a cada 5 min aceita uma nova referência
  if (rtt <= FV.rttMin || !FV._ajusteEm || volta - FV._ajusteEm > 300000) {
    FV.rttMin = rtt; FV._ajusteEm = volta;
    FV.offset = tServidor - (ida + volta) / 2;
  }
}
const FUSO_MANAUS = -4 * 3600000;
/** Data "de parede" de Manaus (use os getUTC...) */
function mz(v) { const n = typeof v === 'number' ? v : Date.parse(v); return isNaN(n) ? null : new Date(n + FUSO_MANAUS); }
const DIAS_CURTOS = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
function textoRelogio() {
  const d = mz(agora());
  return { data: DIAS_CURTOS[d.getUTCDay()] + ', ' + d.getUTCDate() + ' de ' + MESES[d.getUTCMonth()],
    hora: dois(d.getUTCHours()) + ':' + dois(d.getUTCMinutes()) + ':' + dois(d.getUTCSeconds()) };
}
function htmlRelogio() { const r = textoRelogio(); return ic('clock') + '<span data-rel-data>' + r.data + '</span> · <b data-rel-hora>' + r.hora + '</b>'; }
setInterval(function () {
  const r = textoRelogio();
  document.querySelectorAll('[data-rel-hora]').forEach(function (e) { e.textContent = r.hora; });
  document.querySelectorAll('[data-rel-data]').forEach(function (e) { e.textContent = r.data; });
}, 1000);
/** Cada troca de página/aba ganha um número. Respostas que chegam depois de trocar são ignoradas. */
function novaTela() { return ++FV.tela; }
function telaAtual(n) { return n === FV.tela; }

/** Chama uma função do servidor e devolve uma Promise. */
const TEMPO_MAX = { getEstado: 15000, validarSessao: 20000, loginMotorista: 30000, loginAdmin: 30000 };
function api(nome) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve0, reject0) {
    // Se o Google não responder (internet ruim no celular), desiste e tenta de novo — a tela nunca fica parada.
    let fim = false;
    const t = setTimeout(function () { if (!fim) { fim = true; reject0(new Error('A conexão demorou demais. Tente de novo.')); } }, TEMPO_MAX[nome] || 120000);
    const resolve = function (x) { if (fim) return; fim = true; clearTimeout(t); resolve0(x); };
    const reject = function (x) { if (fim) return; fim = true; clearTimeout(t); reject0(x); };
    const ida = Date.now();
    google.script.run
      .withSuccessHandler(function (r) {
        if (!r) return reject(new Error('Sem resposta do servidor'));
        if (r.t) ajustarRelogio(r.t, ida, Date.now());
        if (r.v && window.FV_VERSAO && String(r.v) !== String(window.FV_VERSAO)) avisoVersaoNova();
        if (r.ok) return resolve(r.dados);
        if (r.erro === 'SESSAO_EXPIRADA') { sair(true); return reject(new Error('Sua sessão expirou. Entre novamente.')); }
        reject(new Error(r.erro));
      })
      .withFailureHandler(function (e) { reject(new Error((e && e.message) || String(e))); })[nome].apply(null, args);
  });
}

/* ---------- VERSÃO NOVA E NOVIDADES ----------
 * Toda resposta do servidor diz qual versão está publicada. Se for diferente da versão
 * desta página, o app foi atualizado: aparece o aviso para recarregar.
 * Depois de recarregar, cada pessoa vê uma vez a janela "O que há de novo". */
function avisoVersaoNova() {
  if (document.getElementById('avisoVersao')) return;
  const d = document.createElement('div');
  d.id = 'avisoVersao'; d.className = 'aviso-versao'; d.setAttribute('role', 'status');
  d.innerHTML = '<span><b>O app foi atualizado.</b> Recarregue para usar a versão nova.</span><button type="button">Recarregar agora</button>';
  d.querySelector('button').onclick = recarregarApp;
  document.body.appendChild(d);
}
function recarregarApp() {
  try { if (window.FV_URL) { window.top.location.href = window.FV_URL; return; } } catch (e) { }
  location.reload();
}
function chaveNovid() { return 'fv_novid_' + (FV.tipo === 'M' && M && M.motorista ? M.motorista.id : 'admin'); }
function abrirNovidades(todas) {
  const lista = window.FV_NOVIDADES || [];
  if (!lista.length) return;
  const visto = Number(LS.get(chaveNovid())) || 0;
  let mostrar = todas ? lista.slice(0, 6) : (visto ? lista.filter(function (n) { return Number(n.versao) > visto; }).slice(0, 3) : lista.slice(0, 1));
  if (!mostrar.length) mostrar = lista.slice(0, 1);
  const html = mostrar.map(function (n, k) {
    return '<section class="novid-ver' + (k === 0 ? ' atual' : '') + '"><h3>' + esc(n.titulo) + (n.versao === window.FV_VERSAO ? '<span class="novid-selo">NOVO</span>' : '') + '</h3>' +
      '<small>Versão ' + esc(n.versao) + (n.data ? ' · ' + n.data.split('-').reverse().join('/') : '') + '</small><ul>' +
      (n.itens || []).map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul></section>';
  }).join('') + '<button class="btn btn-azul btn-bloco mt12" data-ok>Entendi</button>';
  const m = abrirModal({ titulo: 'O que há de novo', icone: 'sparkles', html: html, aoFechar: marcarNovidadesVistas });
  m.corpo.querySelector('[data-ok]').onclick = m.fechar;
}
function marcarNovidadesVistas() {
  const v = window.FV_VERSAO;
  if (!v || LS.get(chaveNovid()) === v) return;
  LS.set(chaveNovid(), v);
  api('marcarNovidadesVistas', FV.token, v).catch(function () { });
}
/** Chamado ao entrar no app: mostra as novidades se a pessoa ainda não viu esta versão. */
function checarNovidades() {
  const v = window.FV_VERSAO, tela = FV.tela;
  if (!v || !(window.FV_NOVIDADES || []).length || LS.get(chaveNovid()) === v) return;
  setTimeout(function () {
    if (FV.tela !== tela || !FV.token) return;
    api('novidadesVistas', FV.token).then(function (visto) {
      if (FV.tela !== tela) return;
      if (visto === v) { LS.set(chaveNovid(), v); return; }
      if (!document.querySelector('.modal-fundo')) abrirNovidades(false);
    }).catch(function () { });
  }, 2200);
}

/* ---------- armazenamento local ---------- */
const memoria = {};
const LS = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return memoria[k] || null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { memoria[k] = v; } },
  del: function (k) { try { localStorage.removeItem(k); } catch (e) { delete memoria[k]; } }
};

/* ---------- formatação ---------- */
function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function soDigitos(s) { return String(s || '').replace(/\D/g, ''); }
function fmtCPF(v) {
  const n = soDigitos(v).slice(0, 11);
  if (n.length <= 3) return n;

}

  return lerDataUrl(file).then(function (url) {
    return new Promise(function (res) {
      const img = new Image();
      img.onload = function () {
        const esc2 = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * esc2); c.height = Math.round(img.height * esc2);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);

  });
}

/** Entrada escalonada: os blocos da tela sobem em sequência. O que chegar do Google logo em seguida também entra animado. */
const SEL_ANIM = '.login-card, .cab, .abas, .card, .stat, .fila-item, .lista-mot, .status-card, .item-fila, .mot-relogio';
let _animAte = 0, _animI = 0, _animObs = null;
function animarEntrada(raiz, ms) {
  if (!raiz) return;
  _animAte = Date.now() + (ms || 1600); _animI = 0;
  const marcar = function (el) {
    if (_animI > 16 || el.closest('.modal')) return;
    el.classList.add('anim'); el.style.setProperty('--i', _animI++);
    setTimeout(function () { el.classList.remove('anim'); }, 1600);
  };
  raiz.querySelectorAll(SEL_ANIM).forEach(marcar);
  if (!_animObs && window.MutationObserver) {
    _animObs = new MutationObserver(function (lista) {
      if (Date.now() > _animAte) return;
      lista.forEach(function (m) {
        m.addedNodes.forEach(function (n) {
          if (n.nodeType !== 1) return;
          if (n.matches && n.matches(SEL_ANIM)) marcar(n);
          if (n.querySelectorAll) n.querySelectorAll(SEL_ANIM).forEach(marcar);
        });
      });
    });
    _animObs.observe(document.getElementById('app'), { childList: true, subtree: true });

  };
}

/* ============================================================
   MOTORISTA
   ============================================================ */
/* ================== TELA DO MOTORISTA ================== */
let M = null;
let _gpsWatch = null;

function telaMotorista(motorista, ntfy) {
  FV.tipo = 'M';
  pararTimers();
  M = {
    motorista: motorista, ntfy: ntfy || null, versao: null, fila: [], meu: null, posicao: null, solicitacao: null,
    msg: null, loc: null, dist: null, dentro: null, confirm: 0, confirmTimer: null, statusAnterior: null,
    aba: 'status', online: navigator.onLine !== false, ultimaSync: null, carregado: false, acao: false,
    tentouRaio: false, rejeitadaVista: LS.get('fv_rej') || null, ultimoAvisoGps: 0, mapa: null, mk: {}
  };
  aplicarTema(LS.get('fv_tema') || 'light');

  const cache = LS.get('fv_cache_estado');
  if (cache) { try { aplicarEstado(JSON.parse(cache), true); M.carregado = true; } catch (e) { } }

  document.getElementById('app').innerHTML =
    '<div class="mot entrando" id="motApp">' +
      '<header class="mot-cab"><div class="mot-cab-in">' +
        '<div class="linha cresce">' + imgLogo('mot-logo') + '<div class="cresce" style="min-width:0"><h1 class="cab-tit">Fila de Atendimento</h1><p class="cab-sub" id="mNome">' + esc(motorista.nome_completo) + '</p></div></div>' +
        '<div id="mConexao"></div>' +
        '<button class="btn btn-ico btn-cab" id="mMenu">' + ic('menu') + '</button>' +
      '</div></header>' +
      '<main class="mot-main">' +
        '<div class="mot-relogio"><span class="relogio">' + htmlRelogio() + '</span></div>' +
        '<div id="mStatus"></div>' +
        '<div id="mLocal"></div>' +
        '<div id="mMsg"></div>' +
        '<div id="mFila"></div>' +
      '</main>' +
      '<div class="mot-acao" id="mAcao"></div>' +
      '<div id="mChamada"></div>' +
    '</div>';
  document.getElementById('mMenu').onclick = abrirMenuMotorista;
  setTimeout(function () { const r = document.getElementById('motApp'); if (r) r.classList.remove('entrando'); }, 1900);

  window.addEventListener('online', function () { M && (M.online = true, renderConexao(), pollMotorista(true)); });
  window.addEventListener('offline', function () { M && (M.online = false, renderConexao()); });
  document.addEventListener('visibilitychange', function () { if (M && !document.hidden) pollMotorista(true); });

  renderTudo();
  iniciarGPS();
  pollMotorista(true);
  checarNovidades();
  // Tema automático: confere a cada 10 minutos
  FV.timers.push(setInterval(function () { if ((LS.get('fv_tema') || 'light') === 'auto') aplicarTema('auto'); }, 600000));
}

/* ---------- tema ---------- */
/** modo: 'light' | 'dark' | 'auto' (auto = escuro das 18h às 6h, pelo relógio interno) */
function aplicarTema(modo, animar) {
  let escuro = modo === 'dark' || modo === 'escuro';
  if (modo === 'auto') { const h = mz(agora()).getUTCHours(); escuro = h >= 18 || h < 6; }
  const raiz = document.documentElement, novo = escuro ? 'escuro' : 'claro';
  if (raiz.getAttribute('data-tema') !== novo) {
    if (animar) { raiz.classList.add('tema-anim'); setTimeout(function () { raiz.classList.remove('tema-anim'); }, 450); }
    raiz.setAttribute('data-tema', novo);
  }
}

/* ---------- atualização em tempo real ---------- */
function pollMotorista(forcar) {
  if (!M || FV.tipo !== 'M') return;
  if (M._t) clearTimeout(M._t);
  const proximo = function () {
    if (!M || FV.tipo !== 'M') return;
    const ativo = estaNaFila() || !!M.solicitacao;
    M._t = setTimeout(function () { pollMotorista(); }, document.hidden ? 8000 : (ativo ? 3000 : 5000));
    FV.timers.push(M._t);
  };
  if (M._emCurso && !forcar) { proximo(); return; }
  M._emCurso = true;
  api('getEstado', FV.token, M.versao).then(function (r) {
    M._emCurso = false;
    M.online = true; M.ultimaSync = new Date(agora()).toISOString();
    if (r.mudou) {
      aplicarEstado(r);
      LS.set('fv_cache_estado', JSON.stringify(r));
    }
    renderConexao();
    proximo();
  }).catch(function (e) {
    M._emCurso = false;
    if (!FV.token) return;
    M.online = false; renderConexao();
    if (!M.carregado) { M.carregado = true; M.msg = { tipo: 'warning', texto: 'Sem conexão. Mostrando os últimos dados salvos.' }; renderTudo(); }
    proximo();
  });
}

function aplicarEstado(r, doCache) {
  if (!r || r.mudou === false) return;
  // ignora resposta atrasada (mais velha do que a que já está na tela)
  if (!doCache && M.versao && r.versao && Number(r.versao) < Number(M.versao)) return;
  if (!doCache) LS.set('fv_cache_estado', JSON.stringify(r));
  const novoStatus = r.meu ? r.meu.status : null;
  if (!doCache && M.carregado && novoStatus === 'EM_ATENDIMENTO' && M.statusAnterior !== 'EM_ATENDIMENTO') {
    tocarAlertaChamada();
  }
  M.statusAnterior = novoStatus;
  M.versao = doCache ? null : r.versao;
  M.fila = r.fila || [];
  M.meu = r.meu || null;
  M.posicao = r.posicao || null;
  M.solicitacao = r.solicitacao || null;
  if (!doCache && r.rejeitadaEm && r.rejeitadaEm !== M.rejeitadaVista) {
    M.rejeitadaVista = r.rejeitadaEm; LS.set('fv_rej', r.rejeitadaEm);
    M.msg = { tipo: 'error', texto: 'Sua solicitação de entrada foi rejeitada pelo admin.' };
    setTimeout(function () { if (M && M.msg && /rejeitada/.test(M.msg.texto)) { M.msg = null; renderMsg(); } }, 8000);
  }
  if (!doCache) M.carregado = true;
  if (document.getElementById('mStatus')) renderTudo();
  verificarRaio();
}

/* ---------- desenho da tela ---------- */

}

function estaNaFila() { return M.meu && (M.meu.status === 'NA_FILA' || M.meu.status === 'PAUSADO'); }

  if (M.erroGps) h += '<p class="txt-xs cor-verm mt8">' + esc(M.erroGps) + '</p>';
  if (l && l.accuracy > (c.precisaoMax || 50)) h += '<p class="txt-xs cor-ambar">⚠️ Precisão do GPS baixa (' + Math.round(l.accuracy) + 'm)</p>';
  if (l && c.lat) {

  }
  h += '</div></div>';
  document.getElementById('mAbaStatus').innerHTML = h;

function desenharMapaMotorista() {
  const el = document.getElementById('mMapa'); if (!el || !window.L) return;
  const c = FV.config;
  if (!M.mapa) {
    const centro = M.loc ? [M.loc.lat, M.loc.lng] : [c.lat || -3.1190275, c.lng || -60.0217314];
    M.mapa = novoMapa(el, centro, 15);
    M.mk = {};
    if (c.lat) {
      M.mk.base = L.marker([c.lat, c.lng], { icon: iconeMapa('linear-gradient(135deg,#a9b23a,#8a9230)', SVG_BASE) }).addTo(M.mapa).bindPopup('<b>Base de Atendimento</b><br>' + esc(c.endereco || ''));
      M.mk.raio = L.circle([c.lat, c.lng], { radius: c.raio, color: '#a9b23a', fillOpacity: .1 }).addTo(M.mapa);
    }
  } else { setTimeout(function () { M.mapa && M.mapa.invalidateSize(); }, 100); }
  if (M.loc) {
    const p = [M.loc.lat, M.loc.lng];
    if (!M.mk.eu) M.mk.eu = L.marker(p, { icon: iconeMapa('linear-gradient(135deg,#0b3d61,#082e4a)', SVG_CAMINHAO) }).addTo(M.mapa).bindPopup('<b>Sua Localização</b>');
    else M.mk.eu.setLatLng(p);
    if (!M.mk.precisao) M.mk.precisao = L.circle(p, { radius: M.loc.accuracy, color: '#0b3d61', weight: 1, fillOpacity: .08 }).addTo(M.mapa);
    else { M.mk.precisao.setLatLng(p); M.mk.precisao.setRadius(M.loc.accuracy); }
    if (!M._centrou) { M._centrou = true; M.mapa.setView(p, 15); }
  }
}

function renderMsg() {

    '<div class="card-corpo sem">' + (M.fila.length === 0 ? '<div class="vazio">' + ic('users') + '<p>Nenhum motorista na fila</p></div>' :

function renderAcao() {

  } else {

/* ---------- ações ---------- */
function posicaoAgora() {
  return new Promise(function (resolve) {
    if (!navigator.geolocation) return resolve(M.loc);
    navigator.geolocation.getCurrentPosition(function (p) {
      tratarPosicao(p); resolve(M.loc);
    }, function () { resolve(M.loc); }, { enableHighAccuracy: true, maximumAge: 0, timeout: 6000 });
  });
}

function entrarFila() {
  if (!navigator.onLine) { M.msg = { tipo: 'error', texto: 'Você precisa estar online para entrar na fila.' }; renderMsg(); return; }
  M.acao = true; M.msg = null; renderAcao(); renderMsg();
  posicaoAgora().then(function (loc) {
    return api('entrarNaFila', FV.token, loc ? { lat: loc.lat, lng: loc.lng, accuracy: loc.accuracy } : null);
  }).then(function (r) {
    M.msg = { tipo: r.tipo, texto: r.texto };
    M.acao = false;
    if (r.estado) aplicarEstado(r.estado);
  }).catch(function (e) {
    M.msg = { tipo: 'error', texto: e.message };
  }).then(function () {
    M.acao = false; renderTudo(); pollMotorista(true);
  });
}

function clicarSair() {
  if (M.confirmTimer) clearTimeout(M.confirmTimer);
  if (M.confirm < 2) {
    M.confirm++;
    M.confirmTimer = setTimeout(function () { M.confirm = 0; renderAcao(); }, 3000);
    renderAcao();
    return;
  }
  M.confirm = 3; M.acao = true; renderAcao();
  api('sairDaFila', FV.token).then(function (r) { M.msg = { tipo: r.tipo, texto: r.texto }; M.confirm = 0; M.acao = false; if (r.estado) aplicarEstado(r.estado); })
    .catch(function (e) { M.msg = { tipo: 'error', texto: e.message }; })
    .then(function () { M.confirm = 0; M.acao = false; renderTudo(); pollMotorista(true); });
}

function cancelarSol() {
  M.acao = true; renderAcao();
  api('cancelarSolicitacao', FV.token).then(function (r) { M.msg = { tipo: r.tipo, texto: r.texto }; M.acao = false; if (r.estado) aplicarEstado(r.estado); })
    .catch(function (e) { M.msg = { tipo: 'error', texto: e.message }; })
    .then(function () { M.acao = false; renderTudo(); pollMotorista(true); });
}

/* ---------- GPS e raio ---------- */
function iniciarGPS() {
  if (!navigator.geolocation) { M.erroGps = 'Este aparelho não tem GPS disponível no navegador.'; return; }
  const erroGps = function (e) {
    M.erroGps = e.code === 1 ? 'Permissão de localização negada. Ative a localização para este site.' : 'Não foi possível ler o GPS. Tentando de novo...';
    renderLocal();
  };
  navigator.geolocation.getCurrentPosition(tratarPosicao, erroGps, { enableHighAccuracy: true, maximumAge: 0, timeout: 8000 });
  _gpsWatch = navigator.geolocation.watchPosition(tratarPosicao, erroGps, { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 });
}
window.pararGPS = function () { if (_gpsWatch !== null && navigator.geolocation) navigator.geolocation.clearWatch(_gpsWatch); _gpsWatch = null; };

function tratarPosicao(p) {
  if (!M) return;
  const c = FV.config;
  const loc = { lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy };
  M.loc = loc; M.erroGps = '';
  if (c.lat) {
    M.dist = distanciaM(loc.lat, loc.lng, c.lat, c.lng);
    const dentro = M.dist <= c.raio;
    if (M.dentro !== null && dentro !== M.dentro) {
      if (dentro) avisar('✅ Você está dentro do raio', 'Você já pode entrar na fila de atendimento.');
      else avisar('📍 Você saiu do raio permitido', 'Você está a ' + km(M.dist) + ' da base.');
    }
    if (!dentro) M.tentouRaio = false;
    M.dentro = dentro;
  }
  if (loc.accuracy > (c.precisaoMax || 50) && Date.now() - M.ultimoAvisoGps > 120000) {
    M.ultimoAvisoGps = Date.now();
    if (M.carregado && !estaNaFila() && !emAtendimento()) toast('Sinal de GPS fraco (' + Math.round(loc.accuracy) + 'm). Vá para um lugar aberto.', 'alerta');
  }
  renderLocal();
  verificarRaio();
}

/** Ao chegar no raio: entra sozinho (se tinha solicitação) ou passa para a fila de dentro do raio. */
function verificarRaio() {
  if (!M || !M.dentro || !M.loc || M.tentouRaio || !M.carregado) return;
  const precisa = !!M.solicitacao || (M.meu && M.meu.dentro_raio === false && M.meu.status !== 'EM_ATENDIMENTO');
  if (!precisa) return;
  M.tentouRaio = true;
  api('chegueiNoRaio', FV.token, { lat: M.loc.lat, lng: M.loc.lng, accuracy: M.loc.accuracy }).then(function (r) {
    if (r && r.estado) aplicarEstado(r.estado);
    if (r && r.texto) { M.msg = { tipo: r.tipo, texto: r.texto }; renderMsg(); avisar('✅ Você chegou na base', r.texto); }
    else M.tentouRaio = false;
    pollMotorista(true);
  }).catch(function () { M.tentouRaio = false; });
}

/* ---------- alertas ---------- */
let _audio = null;
function bip(freq, ini, dur) {
  try {
    _audio = _audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = _audio.createOscillator(), g = _audio.createGain();
    o.type = 'square'; o.frequency.value = freq; o.connect(g); g.connect(_audio.destination);
    const t = _audio.currentTime + ini;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur + 0.05);
  } catch (e) { }
}
document.addEventListener('click', function () { try { _audio = _audio || new (window.AudioContext || window.webkitAudioContext)(); _audio.resume(); } catch (e) { } }, { once: false, passive: true });

function tocarAlertaChamada() {
  for (let i = 0; i < 6; i++) { bip(880, i * 0.5, 0.22); bip(1175, i * 0.5 + 0.25, 0.22); }
  try {
    if ('speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance('É a sua vez! Você está sendo chamado para atendimento.');
      u.lang = 'pt-BR'; u.rate = 1.1; u.pitch = 1.2;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
      setTimeout(function () { speechSynthesis.speak(u); }, 3500);
    }
  } catch (e) { }
  try { if (navigator.vibrate) { navigator.vibrate([500, 200, 500, 200, 500, 200, 500, 200, 500]); setTimeout(function () { navigator.vibrate([300, 150, 300, 150, 300]); }, 2500); } } catch (e) { }
  avisar('🚨 É A SUA VEZ!', 'Você está sendo chamado para atendimento. Dirija-se ao posto IMEDIATAMENTE.', true);
}

function avisar(titulo, texto, urgente) {
  try {
    if ('Notification' in window && Notification.permission === 'granted') {

}

/* ---------- tempo real ---------- */
function pollAdmin(forcar) {
  if (!A || FV.tipo !== 'A') return;
  if (A._t) clearTimeout(A._t);
  const proximo = function () { if (A && FV.tipo === 'A') { A._t = setTimeout(pollAdmin, document.hidden ? 10000 : 3000); FV.timers.push(A._t); } };
  if (A._emCurso && !forcar) { proximo(); return; }
  A._emCurso = true;
  api('getEstado', FV.token, A.versao).then(function (r) {
    A._emCurso = false;
    marcarConexao(true);
    // enquanto uma ação está sendo gravada, a tela já mostra o resultado esperado — não volta para o estado antigo
    if (!A.pendentes) aplicarEstadoAdmin(r);
    proximo();
  }).catch(function () { A._emCurso = false; marcarConexao(false); proximo(); });
}
function aplicarEstadoAdmin(r) {
  if (!A || !r || !r.mudou) return;
  if (A.versao && r.versao && Number(r.versao) < Number(A.versao)) return; // resposta atrasada
  const novasSol = (r.solicitacoes || []).filter(function (s) { return !A.solicitacoes.some(function (x) { return x.id === s.id; }); });
  if (A.carregado && novasSol.length) { toast('Nova solicitação de entrada: ' + novasSol[0].motorista_nome, 'alerta'); bipAdmin(); }
  A.versao = r.versao; A.ativos = r.ativos || []; A.solicitacoes = r.solicitacoes || []; A.tempoMedio = r.tempoMedio || 0; A.carregado = true;
  if (A.pagina === 'dashboard' && !A.arrastando) renderDashboard(document.getElementById('aConteudo'));
}
function marcarConexao(on) {
  const el = document.getElementById('aCon'), el2 = document.getElementById('aCon2');
  if (el) { el.className = 'conexao ' + (on ? 'on' : 'off'); el.innerHTML = '<span class="ponto"></span>' + (on ? 'Online' : 'Offline'); }
  if (el2) el2.className = 'conexao ' + (on ? 'on' : 'off');
}
function bipAdmin() { try { if (window.bip) { bip(660, 0, .15); bip(990, .18, .2); } } catch (e) { } }

/* ---------- ações na fila ---------- */
/** Mostra o resultado na tela NA HORA (antes do Google confirmar). Se der erro, a tela volta ao normal sozinha. */
function otimista(nome, args) {
  const naFila = function () { return A.ativos.filter(function (f) { return f.status === 'NA_FILA'; }).sort(function (a, b) { return (a.ordem || 0) - (b.ordem || 0); }); };
  const item = function (id) { return A.ativos.find(function (f) { return f.id === id; }); };
  const maxOrdem = function () { return naFila().reduce(function (m, f) { return Math.max(m, f.ordem || 0); }, 0); };
  const id = args[0];
  if (nome === 'removerDaFila' || nome === 'finalizarAtendimento') A.ativos = A.ativos.filter(function (f) { return f.id !== id; });
  if (nome === 'pausarAtendimento' && item(id)) item(id).status = 'PAUSADO';
  if (nome === 'retomarAtendimento' && item(id)) { const o = maxOrdem() + 1; item(id).status = 'NA_FILA'; item(id).ordem = o; }
  if (nome === 'chamarProximo') { const p = naFila()[0]; if (p) { p.status = 'EM_ATENDIMENTO'; p.inicio_atendimento = new Date(agora()).toISOString(); } }
  if (nome === 'moverNaFila') {
    const l = naFila(), i = l.findIndex(function (f) { return f.id === id; }), j = i + (args[1] < 0 ? -1 : 1);
    if (i > -1 && j > -1 && j < l.length) { const t = l[i].ordem; l[i].ordem = l[j].ordem; l[j].ordem = t; }
  }
  if (nome === 'reordenarFila') {
    const l = naFila(), dentro = l.filter(function (f) { return f.dentro_raio !== false; });
    const nova = id.map(function (x) { return dentro.find(function (f) { return f.id === x; }); }).filter(Boolean);
    let k = 0; l.map(function (f) { return f.dentro_raio !== false ? nova[k++] || f : f; }).forEach(function (f, n) { f.ordem = n + 1; });
  }
  if (nome === 'aprovarSolicitacao' || nome === 'rejeitarSolicitacao') A.solicitacoes = A.solicitacoes.filter(function (x) { return x.id !== id; });
  if (A.pagina === 'dashboard') renderDashboard(document.getElementById('aConteudo'));
}

function acaoFila(nome, args, msgOk) {
  const chave = nome + (args[0] || '');
  if (A.processando[chave]) return Promise.resolve();
  A.processando[chave] = true;
  A.pendentes++;
  try { otimista(nome, args); } catch (e) { console.error(e); }
  return api.apply(null, [nome, FV.token].concat(args)).then(function (r) {
    if (msgOk) toast(typeof msgOk === 'function' ? msgOk(r) : msgOk, 'ok');
    if (r && r.estado && A) aplicarEstadoAdmin(r.estado);
    return r;
  }).catch(function (e) { erro(e); if (A) A.versao = null; }).then(function (r) {
    if (!A) return r;
    delete A.processando[chave];
    A.pendentes = Math.max(0, A.pendentes - 1);
    if (!A.pendentes) pollAdmin(true);
    return r;
  });
}

function renderDashboard(c) {
  if (!c || A.pagina !== 'dashboard') return;

  const na = A.ativos.filter(function (f) { return f.status === 'NA_FILA'; }).sort(function (a, b) { return (a.ordem || 0) - (b.ordem || 0); });
  const dentro = na.filter(function (f) { return f.dentro_raio !== false; });
  const fora = na.filter(function (f) { return f.dentro_raio === false; });
  const atend = A.ativos.filter(function (f) { return f.status === 'EM_ATENDIMENTO'; });
  const paus = A.ativos.filter(function (f) { return f.status === 'PAUSADO'; });

  ];

  }).join('') + '</div>';

  // Solicitações
  h += '<div class="card mt16"><div class="card-faixa" style="background:linear-gradient(90deg,#f59e0b,#f97316)"></div><div class="card-cab"><div class="card-tit">' + ic('bell-ring', 'cor-ambar') +
    'Solicitações de Entrada' + (A.solicitacoes.length ? ' <span class="tag tag-ambar">' + A.solicitacoes.length + '</span>' : '') + '</div></div><div class="card-corpo">';
  if (!A.solicitacoes.length) h += '<div class="vazio" style="padding:18px">' + ic('bell-ring') + '<p class="txt-sm">Nenhuma solicitação pendente</p></div>';
  else h += A.solicitacoes.map(function (s) {
    const ocupado = A.processando['aprovarSolicitacao' + s.id] || A.processando['rejeitarSolicitacao' + s.id];
    return '<div class="fila-item item-sol"><div class="cresce"><div class="negrito">' + esc(s.motorista_nome) + '</div><div class="meta">' +
      '<span>' + ic('user', 'ic-sm') + fmtCPF(s.motorista_cpf) + '</span><span>' + ic('truck', 'ic-sm') + esc(fmtPlaca(s.motorista_placa) || 'Sem placa') + '</span>' +
      '<span>' + ic('map-pin', 'ic-sm') + (s.distancia_metros ? km(s.distancia_metros) + ' da base' : 'Fora do raio') + '</span><span>' + ic('clock', 'ic-sm') + fmtHora(s.created_date) + '</span></div></div>' +
      '<div class="linha"><button class="btn btn-sm btn-verde" data-aprovar="' + s.id + '" ' + (ocupado ? 'disabled' : '') + '>' + ic('check', 'ic-sm') + 'Aprovar</button>' +
      '<button class="btn btn-sm btn-contorno-verm" data-rejeitar="' + s.id + '" ' + (ocupado ? 'disabled' : '') + '>' + ic('x', 'ic-sm') + 'Rejeitar</button></div></div>';
  }).join('');
  h += '</div></div>';

  if (atend.length) h += blocoFila('Em Atendimento', 'user-check', 'cor-verde', 'linear-gradient(90deg,#a9b23a,#8a9230)', atend, 'atendimento');
  if (paus.length) h += blocoFila('Pausados', 'pause-circle', 'cor-ambar', 'linear-gradient(90deg,#f59e0b,#d97706)', paus, 'pausado');

  // Fila dentro do raio
  h += '<div class="card mt16"><div class="card-faixa" style="background:linear-gradient(90deg,#0b3d61,#082e4a)"></div><div class="card-cab"><div class="card-tit">' + ic('users', 'cor-azul') +
    'Fila - Dentro do Raio' + (dentro.length ? ' <span class="tag tag-azul">' + dentro.length + '</span>' : '') + '</div>' +
    (na.length ? '<button class="btn btn-verde" id="dChamar" ' + (A.processando.chamarProximo ? 'disabled' : '') + '>' + ic('user-check') + 'Chamar Próximo</button>' : '') +
    '</div><div class="card-corpo">';
  if (!dentro.length) h += '<div class="vazio">' + ic('users') + '<p>Nenhum motorista no raio</p></div>';
  else h += '<div id="dLista">' + dentro.map(function (f, i) { return itemFila(f, i, 'fila', na); }).join('') + '</div>' +
    '<p class="txt-xs txt2 centro">Arraste pela alça ' + ic('grip-vertical', 'ic-sm') + ' ou use as setas para mudar a ordem</p>';
  h += '</div></div>';

  if (fora.length) h += blocoFila('Fila - Fora do Raio', 'map-pin', 'cor-ambar', 'linear-gradient(90deg,#f97316,#ea580c)', fora, 'fila', na);

  c.innerHTML = h;
  icones();

  c.querySelectorAll('[data-aprovar]').forEach(function (b) { b.onclick = function () { b.disabled = true; acaoFila('aprovarSolicitacao', [b.dataset.aprovar], 'Solicitação aprovada'); }; });
  c.querySelectorAll('[data-rejeitar]').forEach(function (b) { b.onclick = function () { b.disabled = true; acaoFila('rejeitarSolicitacao', [b.dataset.rejeitar], 'Solicitação rejeitada'); }; });
  const bc = document.getElementById('dChamar');
  if (bc) bc.onclick = function () {
    bc.disabled = true; bc.innerHTML = '<span class="spinner pq branco"></span>';
    acaoFila('chamarProximo', [], function (r) { return r.nome + ' foi chamado' + (r.avisos && r.avisos.length ? ' (' + r.avisos.join(', ') + ')' : ''); });
  };
  c.querySelectorAll('[data-acao]').forEach(function (b) {
    b.onclick = function () {
      const id = b.dataset.id, ac = b.dataset.acao;
      if (ac === 'remover') {
        const it = A.ativos.find(function (f) { return f.id === id; });
        confirmar('Remover ' + (it ? it.motorista_nome : 'motorista') + ' da fila?', { titulo: 'Remover da fila', botao: 'Remover', classe: 'btn-verm', icone: 'user-x' })
          .then(function (ok) { if (ok) acaoFila('removerDaFila', [id], 'Motorista removido da fila'); });
        return;
      }
      b.disabled = true;
      if (ac === 'pausar') acaoFila('pausarAtendimento', [id]);
      if (ac === 'retomar') acaoFila('retomarAtendimento', [id]);
      if (ac === 'finalizar') acaoFila('finalizarAtendimento', [id], 'Atendimento finalizado');
      if (ac === 'subir') acaoFila('moverNaFila', [id, -1]);
      if (ac === 'descer') acaoFila('moverNaFila', [id, 1]);
    };
  });
  c.querySelectorAll('[data-perfil]').forEach(function (n) { n.onclick = function () { abrirPerfil(n.dataset.perfil); }; });

  const lista = document.getElementById('dLista');
  if (lista && window.Sortable) {
    Sortable.create(lista, {
      handle: '.alca', animation: 150, delay: 0,
      onStart: function () { A.arrastando = true; },
      onEnd: function (ev) {
        A.arrastando = false;
        if (ev.oldIndex === ev.newIndex) return;
        const ids = Array.prototype.map.call(lista.querySelectorAll('[data-item]'), function (e) { return e.dataset.item; });
        acaoFila('reordenarFila', [ids], 'Fila reordenada');
      }
    });
  }
}

function blocoFila(titulo, icone, cor, faixa, itens, tipo, na) {
  return '<div class="card mt16"><div class="card-faixa" style="background:' + faixa + '"></div><div class="card-cab"><div class="card-tit">' + ic(icone, cor) + esc(titulo) +
    ' <span class="tag">' + itens.length + '</span></div></div><div class="card-corpo">' +
    itens.map(function (f, i) { return itemFila(f, i, tipo, na); }).join('') + '</div></div>';
}

function itemFila(f, i, tipo, na) {
  let esq = '';
  if (tipo === 'fila') {
    const pos = na ? na.findIndex(function (x) { return x.id === f.id; }) + 1 : i + 1;
    esq = '<span class="alca">' + ic('grip-vertical') + '</span><div class="num">' + pos + '</div>';
  }
  if (tipo === 'atendimento') esq = '<div class="stat-ico" style="width:40px;height:40px;background:var(--verde-cl);color:var(--verde2)">' + ic('user-check') + '</div>';
  if (tipo === 'pausado') esq = '<div class="stat-ico" style="width:40px;height:40px;background:var(--ambar-cl);color:var(--ambar2)">' + ic('pause') + '</div>';
  let acoes = '';
  if (tipo === 'fila') {
    const idx = na ? na.findIndex(function (x) { return x.id === f.id; }) : i;
    acoes += '<button class="btn btn-ico" data-acao="subir" data-id="' + f.id + '" title="Subir" ' + (idx <= 0 ? 'disabled' : '') + '>' + ic('chevron-up') + '</button>' +
      '<button class="btn btn-ico" data-acao="descer" data-id="' + f.id + '" title="Descer" ' + (na && idx >= na.length - 1 ? 'disabled' : '') + '>' + ic('chevron-down') + '</button>' +
      '<button class="btn btn-ico ambar" data-acao="pausar" data-id="' + f.id + '" title="Pausar">' + ic('pause') + '</button>';
  }
  if (tipo === 'pausado') acoes += '<button class="btn btn-ico verde" data-acao="retomar" data-id="' + f.id + '" title="Retomar">' + ic('play') + '</button>';
  if (tipo === 'atendimento') acoes += '<button class="btn btn-sm btn-contorno-verde" data-acao="finalizar" data-id="' + f.id + '">' + ic('user-check', 'ic-sm') + 'Finalizar</button>';
  acoes += '<button class="btn btn-ico verm" data-acao="remover" data-id="' + f.id + '" title="Remover da fila">' + ic('x') + '</button>';
  return '<div class="fila-item" data-item="' + f.id + '"><div class="linha cresce">' + esq + '<div class="cresce"><div class="linha quebra" style="gap:6px">' +
    '<span class="nome" data-perfil="' + f.motorista_id + '">' + esc(f.motorista_nome) + '</span><span class="tag tag-borda">' + esc(f.motorista_regime || '') + '</span></div>' +
    '<div class="meta"><span>' + ic('user', 'ic-sm') + maskCPF(f.motorista_cpf) + '</span><span>' + ic('truck', 'ic-sm') + esc(fmtPlaca(f.motorista_placa) || 'Sem placa') + '</span>' +
    '<span>' + ic('clock', 'ic-sm') + fmtHora(f.hora_entrada || f.created_date) + '</span>' +
    (f.status === 'EM_ATENDIMENTO' && f.inicio_atendimento ? '<span>' + ic('timer', 'ic-sm') + 'chamado às ' + fmtHora(f.inicio_atendimento) + '</span>' : '') + '</div></div></div>' +
    '<div class="linha" style="gap:2px">' + acoes + '</div></div>';
}

/* ---------- adicionar motorista na fila ---------- */
function modalAdicionarNaFila() {
  const m = abrirModal({ titulo: 'Adicionar Motorista na Fila', icone: 'user-plus', tamanho: 'medio',
    html: '<div class="campo"><label>Buscar Motorista</label><div class="inp-ico">' + ic('search') + '<input class="inp" id="adBusca" placeholder="Buscar por nome ou CPF..."></div></div><div id="adLista"><div class="spinner"></div></div>' });
  let lista = [];
  const desenhar = function () {
    const t = m.corpo.querySelector('#adBusca').value.toLowerCase(), d = soDigitos(t);
    const ocupados = A.ativos.map(function (f) { return f.motorista_id; });
    const fil = lista.filter(function (x) { return !x.bloqueado && (String(x.nome_completo).toLowerCase().indexOf(t) > -1 || (d && String(x.cpf).indexOf(d) > -1)); });
    m.corpo.querySelector('#adLista').innerHTML = fil.length ? fil.map(function (x) {
      const naFila = ocupados.indexOf(x.id) > -1;
      return '<div class="lista-mot"><div class="linha cresce"><div class="avatar">' + ic('user') + '</div><div class="cresce"><div class="negrito">' + esc(x.nome_completo) + '</div>' +
        '<div class="meta"><span>' + fmtCPF(x.cpf) + '</span><span>' + ic('truck', 'ic-sm') + esc(fmtPlaca(x.placa) || 'Sem placa') + '</span><span class="tag tag-borda">' + esc(x.regime) + '</span></div></div></div>' +
        (naFila ? '<span class="tag tag-azul">Já na fila</span>' : '<button class="btn btn-sm btn-azul" data-add="' + x.id + '">' + ic('user-plus', 'ic-sm') + 'Adicionar</button>') + '</div>';
    }).join('') : '<div class="vazio">' + ic('user') + '<p>Nenhum motorista encontrado</p></div>';
    icones();
    m.corpo.querySelectorAll('[data-add]').forEach(function (b) {
      b.onclick = function () {
        b.disabled = true; b.innerHTML = '<span class="spinner pq branco"></span>';
        api('adicionarNaFila', FV.token, b.dataset.add).then(function () { toast('Motorista adicionado à fila', 'ok'); m.fechar(); pollAdmin(true); })
          .catch(function (e) { erro(e); b.disabled = false; b.textContent = 'Adicionar'; });
      };
    });
  };
  m.corpo.querySelector('#adBusca').oninput = desenhar;
  setTimeout(function () { m.corpo.querySelector('#adBusca').focus(); }, 80);
  const tela = FV.tela;
  api('listarMotoristas', FV.token).then(function (l) { if (!telaAtual(tela)) return; lista = l; desenhar(); }).catch(function (e) { if (telaAtual(tela)) erro(e); });
}

/* ================== ADMIN — MOTORISTAS ================== */
const OPC_REGIME = [['CLT', 'CLT'], ['AGREGADO', 'Agregado'], ['AVULSO', 'Avulso'], ['TESTER', 'Tester']];
function selectRegime(id, valor, vazio) {
  return '<select class="inp" id="' + id + '">' + (vazio ? '<option value="">' + vazio + '</option>' : '') +
    OPC_REGIME.map(function (o) { return '<option value="' + o[0] + '"' + (valor === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>';
}
function statusDocs(m) {
  const c = diasAte(m.cnh_validade), r = diasAte(m.crlv_validade);
  if ((c !== null && c < 0) || (r !== null && r < 0)) return 'vencido';
  if ((c !== null && c <= 30) || (r !== null && r <= 30)) return 'vencer';
  return 'ok';
}
function tagStatusDocs(m) {
  const s = statusDocs(m);
  if (s === 'vencido') return '<span class="tag tag-verm">' + ic('alert-circle', 'ic-sm') + 'Doc Vencido</span>';
  if (s === 'vencer') return '<span class="tag tag-ambar">' + ic('calendar', 'ic-sm') + 'A Vencer</span>';
  return '';
}
function avatarMot(m) { return '<div class="avatar" data-foto="' + esc(m.id) + '">' + ic('user') + '</div>'; }
function carregarAvatares(cont, lista) {
  cont.querySelectorAll('[data-foto]').forEach(function (el) {
    const m = lista.find(function (x) { return x.id === el.dataset.foto; });
    if (m && (m.foto_id || m.foto_url)) mostrarFoto(el, m);
  });
}

function telaGerenciar(c) {
  c.innerHTML = '<div id="gAbas"></div>';
  montarAbas(c.querySelector('#gAbas'), [
    { id: 'cad', rotulo: 'Cadastrar', icone: 'user-plus' },
    { id: 'edit', rotulo: 'Editar', icone: 'pencil' },
    { id: 'bloq', rotulo: 'Bloquear', icone: 'user-x' },
    { id: 'del', rotulo: 'Deletar', icone: 'trash-2' }
  ], function (id, cont) {
    if (id === 'cad') formCadastro(cont);
    if (id === 'edit') listaEditar(cont);
    if (id === 'bloq') listaBloquear(cont);
    if (id === 'del') telaDeletar(cont);
  });
}

/* ---------- cadastrar ---------- */
function formCadastro(cont) {
  cont.innerHTML = '<div class="card" style="max-width:720px;margin:auto"><div class="card-cab"><div><div class="card-tit">' + ic('user-plus', 'cor-azul') + 'Cadastrar Motorista</div>' +
    '<div class="card-sub">Adicione um novo motorista ao sistema</div></div></div><div class="card-corpo"><form id="cForm">' +
    '<div class="campo"><label>Nome Completo <span class="obrig">*</span></label><input class="inp" id="cNome" placeholder="Digite o nome completo"></div>' +
    '<div class="grade2"><div class="campo"><label>CPF <span class="obrig">*</span></label><input class="inp" id="cCpf" inputmode="numeric" placeholder="000.000.000-00"></div>' +
    '<div class="campo"><label>Senha <span class="obrig">*</span></label><input class="inp" id="cSenha" type="password" placeholder="Digite a senha"></div></div>' +
    '<div class="campo"><label>WhatsApp / Telefone</label><input class="inp" id="cTel" inputmode="numeric" placeholder="(92) 99999-9999"></div>' +
    '<div class="grade2"><div class="campo"><label>Regime <span class="obrig">*</span></label>' + selectRegime('cReg', '', 'Selecione o regime') + '</div>' +
    '<div class="campo"><label>Placa do Veículo</label><input class="inp" id="cPlaca" placeholder="ABC-1234"></div></div>' +
    '<div class="chave-liga"><div><div class="negrito txt-sm">Veículo Rastreado</div><div class="txt-xs txt2">O veículo possui rastreador?</div></div><label class="switch"><input type="checkbox" id="cRast"><span></span></label></div>' +
    '<div class="aviso aviso-info mb16">' + ic('info', 'ic-sm') + '<div class="txt-sm"><b>Lembrete:</b> Após o cadastro, você poderá adicionar os documentos (CNH, CRLV) na aba "Editar" &gt; "Documentos".</div></div>' +
    '<div id="cMsg" class="mb12"></div><button class="btn btn-azul btn-lg btn-bloco" id="cBtn">' + ic('user-plus') + 'Cadastrar Motorista</button></form></div></div>';
  icones();
  const $ = function (id) { return cont.querySelector('#' + id); };
  $('cCpf').oninput = function () { this.value = fmtCPF(this.value); };
  $('cPlaca').oninput = function () { this.value = fmtPlaca(this.value); };
  $('cTel').oninput = function () { this.value = soDigitos(this.value).slice(0, 11); };
  $('cForm').onsubmit = function (e) {
    e.preventDefault();
    const btn = $('cBtn'); btn.disabled = true; btn.innerHTML = '<span class="spinner pq branco"></span>';
    $('cMsg').innerHTML = '';
    api('cadastrarMotorista', FV.token, {
      nome_completo: $('cNome').value, cpf: $('cCpf').value, senha: $('cSenha').value, regime: $('cReg').value,
      placa: $('cPlaca').value, telefone: $('cTel').value, rastreado: $('cRast').checked
    }).then(function () {
      $('cMsg').innerHTML = caixaAviso('success', 'Motorista cadastrado com sucesso!');
      $('cForm').reset();
      setTimeout(function () { const x = $('cMsg'); if (x) x.innerHTML = ''; }, 3000);
    }).catch(function (er) { $('cMsg').innerHTML = caixaAviso('error', er.message); })
      .then(function () { btn.disabled = false; btn.innerHTML = ic('user-plus') + 'Cadastrar Motorista'; icones(); });
  };
}

/* ---------- editar ---------- */
function listaEditar(cont) {
  const st = { lista: [], busca: '', regime: 'todos', docs: 'todos', ord: 'nome_completo', dir: 1 };
  cont.innerHTML = '<div class="card"><div class="card-cab"><div><div class="card-tit">' + ic('pencil', 'cor-azul') + 'Editar Motoristas</div>' +
    '<div class="card-sub">Pesquise e edite os dados dos motoristas cadastrados</div></div></div><div class="card-corpo">' +
    '<div class="inp-ico mb12">' + ic('search') + '<input class="inp" id="eBusca" placeholder="Buscar por nome, CPF ou placa..."></div>' +
    '<div class="linha quebra mb12"><span class="txt-sm txt2">' + ic('filter', 'ic-sm') + ' Filtros:</span>' +
    '<select class="inp" style="width:auto" id="eReg"><option value="todos">Todos Regimes</option>' + OPC_REGIME.map(function (o) { return '<option value="' + o[0] + '">' + o[1] + '</option>'; }).join('') + '</select>' +
    '<select class="inp" style="width:auto" id="eDocs"><option value="todos">Todos Documentos</option><option value="ok">Documentos OK</option><option value="vencer">A Vencer (30 dias)</option><option value="vencido">Documentos Vencidos</option></select>' +
    '<span class="txt-sm txt2" style="margin-left:8px">Ordenar por:</span><div class="linha" style="gap:4px" id="eOrd">' +
    [['nome_completo', 'Nome'], ['cpf', 'CPF'], ['placa', 'Placa'], ['regime', 'Regime']].map(function (o) { return '<button class="btn btn-sm btn-contorno" data-ord="' + o[0] + '">' + o[1] + '</button>'; }).join('') +
    '</div></div><div id="eLista"><div class="spinner"></div></div></div></div>';
  icones();
  const desenhar = function () {
    const t = st.busca.toLowerCase(), d = soDigitos(st.busca);
    const fil = st.lista.filter(function (m) {
      const ok = String(m.nome_completo).toLowerCase().indexOf(t) > -1 || (d && String(m.cpf).indexOf(d) > -1) || String(m.placa || '').toLowerCase().indexOf(t.replace(/[^a-z0-9]/g, '')) > -1;
      return ok && (st.regime === 'todos' || m.regime === st.regime) && (st.docs === 'todos' || statusDocs(m) === st.docs);
    }).sort(function (a, b) {
      const x = String(a[st.ord] || '').toLowerCase(), y = String(b[st.ord] || '').toLowerCase();
      return x < y ? -st.dir : x > y ? st.dir : 0;
    });
    cont.querySelectorAll('[data-ord]').forEach(function (b) {
      const at = b.dataset.ord === st.ord;
      b.className = 'btn btn-sm ' + (at ? 'btn-escuro' : 'btn-contorno');
      b.innerHTML = b.textContent.replace(/[↑↓]/g, '').trim() + (at ? (st.dir > 0 ? ' ↑' : ' ↓') : '');
    });
    const el = cont.querySelector('#eLista');
    el.innerHTML = fil.length ? fil.map(function (m) {
      return '<div class="lista-mot"><div class="linha cresce">' + avatarMot(m) + '<div class="cresce"><div class="linha quebra" style="gap:6px"><span class="nome negrito" style="cursor:pointer" data-perfil="' + m.id + '">' + esc(m.nome_completo) + '</span>' +
        (m.bloqueado ? '<span class="tag tag-verm">Bloqueado</span>' : '') + tagStatusDocs(m) + '</div>' +
        '<div class="meta"><span>' + ic('user', 'ic-sm') + fmtCPF(m.cpf) + '</span><span>' + ic('truck', 'ic-sm') + esc(fmtPlaca(m.placa) || 'Sem placa') + '</span><span class="tag tag-borda">' + esc(m.regime) + '</span></div></div></div>' +
        '<div class="linha"><button class="btn btn-sm btn-contorno" data-perfil="' + m.id + '">' + ic('eye', 'ic-sm') + '</button><button class="btn btn-sm btn-azul" data-edit="' + m.id + '">' + ic('pencil', 'ic-sm') + 'Editar</button></div></div>';
    }).join('') : '<div class="vazio">' + ic('user') + '<p>Nenhum motorista encontrado</p></div>';
    icones();
    carregarAvatares(el, st.lista);
    el.querySelectorAll('[data-edit]').forEach(function (b) {
      b.onclick = function () { modalEditar(st.lista.find(function (m) { return m.id === b.dataset.edit; }), function (novo) { const i = st.lista.findIndex(function (m) { return m.id === novo.id; }); st.lista[i] = novo; desenhar(); }); };
    });
    el.querySelectorAll('[data-perfil]').forEach(function (b) { b.onclick = function () { abrirPerfil(b.dataset.perfil); }; });
  };
  cont.querySelector('#eBusca').oninput = function () { st.busca = this.value; desenhar(); };
  cont.querySelector('#eReg').onchange = function () { st.regime = this.value; desenhar(); };
  cont.querySelector('#eDocs').onchange = function () { st.docs = this.value; desenhar(); };
  cont.querySelectorAll('[data-ord]').forEach(function (b) { b.onclick = function () { if (st.ord === b.dataset.ord) st.dir = -st.dir; else { st.ord = b.dataset.ord; st.dir = 1; } desenhar(); }; });
  const tela = FV.tela;
  api('listarMotoristas', FV.token).then(function (l) { if (!telaAtual(tela)) return; st.lista = l; desenhar(); }).catch(function (e) { if (telaAtual(tela)) erro(e); });
}

function modalEditar(m, aoSalvar) {
  const md = abrirModal({ titulo: 'Editar: ' + m.nome_completo, icone: 'pencil', tamanho: 'largo', html: '<div id="edAbas"></div>' });
  let atual = m;
  montarAbas(md.corpo.querySelector('#edAbas'), [{ id: 'dados', rotulo: 'Dados Básicos', icone: 'user' }, { id: 'docs', rotulo: 'Documentos', icone: 'file-text' }], function (id, cont) {
    if (id === 'docs') { painelDocumentos(cont, atual, function (novo) { atual = novo; if (aoSalvar) aoSalvar(novo); }); return; }
    cont.innerHTML = '<form id="edF"><div class="campo"><label>Nome Completo <span class="obrig">*</span></label><input class="inp" id="edNome" value="' + esc(atual.nome_completo) + '"></div>' +
      '<div class="grade2"><div class="campo"><label>CPF</label><input class="inp" value="' + fmtCPF(atual.cpf) + '" disabled></div>' +
      '<div class="campo"><label>Nova senha</label><div class="inp-olho"><input class="inp" id="edSenha" type="password" placeholder="Deixe em branco para manter a atual"><button type="button" class="btn btn-ico" id="edOlho">' + ic('eye') + '</button></div></div></div>' +
      '<div class="campo"><label>WhatsApp / Telefone</label><input class="inp" id="edTel" inputmode="numeric" value="' + esc(atual.telefone || '') + '" placeholder="(92) 99999-9999"></div>' +
      '<div class="grade2"><div class="campo"><label>Regime <span class="obrig">*</span></label>' + selectRegime('edReg', atual.regime, 'Selecione o regime') + '</div>' +
      '<div class="campo"><label>Placa do Veículo</label><input class="inp" id="edPlaca" value="' + esc(fmtPlaca(atual.placa)) + '" placeholder="ABC-1234"></div></div>' +
      '<div class="chave-liga"><div><div class="negrito txt-sm">Veículo Rastreado</div><div class="txt-xs txt2">O veículo possui rastreador?</div></div><label class="switch"><input type="checkbox" id="edRast"' + (atual.rastreado ? ' checked' : '') + '><span></span></label></div>' +
      '<div id="edMsg" class="mb12"></div><button class="btn btn-azul btn-bloco btn-lg" id="edBtn">' + ic('save') + 'Salvar alterações</button></form>';
    icones();

    $('edOlho').onclick = function () { const s = $('edSenha'); s.type = s.type === 'password' ? 'text' : 'password'; };
    $('edF').onsubmit = function (e) {
      e.preventDefault();
      const b = $('edBtn'); b.disabled = true; b.innerHTML = '<span class="spinner pq branco"></span>';
      api('editarMotorista', FV.token, atual.id, {
        nome_completo: $('edNome').value, senha: $('edSenha').value, regime: $('edReg').value,
        placa: $('edPlaca').value, telefone: $('edTel').value, rastreado: $('edRast').checked
      }).then(function (novo) {
        atual = novo; if (aoSalvar) aoSalvar(novo);
        $('edMsg').innerHTML = caixaAviso('success', 'Motorista atualizado com sucesso!'); icones();
        setTimeout(md.fechar, 1200);
      }).catch(function (er) { $('edMsg').innerHTML = caixaAviso('error', er.message); icones(); b.disabled = false; b.innerHTML = ic('save') + 'Salvar alterações'; icones(); });
    };

}

/* ---------- documentos CNH / CRLV ---------- */
function statusDoc(validade, aprovado) {
  if (!validade) return ['Não informado', 'tag', 'x-circle'];
  const d = diasAte(validade);
  if (d < 0) return ['Vencido', 'tag tag-verm', 'x-circle'];
  if (d <= 30) return ['Vence em breve', 'tag tag-ambar', 'alert-triangle'];
  if (!aprovado) return ['Aguardando aprovação', 'tag tag-azul', 'alert-triangle'];
  return ['Válido', 'tag tag-verde', 'check-circle'];
}
function textoDias(validade) {
  const d = diasAte(validade); if (d === null) return '';
  const cls = d < 0 ? 'cor-verm' : d <= 30 ? 'cor-ambar' : 'cor-verde';
  return '<p class="txt-xs ' + cls + '">' + (d < 0 ? 'Vencido há ' + Math.abs(d) + ' dias' : d === 0 ? 'Vence hoje!' : 'Vence em ' + d + ' dias') + '</p>';
}
function painelDocumentos(cont, m, aoMudar, somenteLeitura) {
  const card = function (tipo) {
    const cnh = tipo === 'cnh';
    const val = m[tipo + '_validade'], apr = m[tipo + '_aprovado'];
    const temArq = m[tipo + '_documento_id'] || m[tipo + '_documento_url'];
    const s = statusDoc(val, apr);
    let h = '<div class="card" style="border:2px solid var(--borda);box-shadow:none"><div class="card-cab"><div class="card-tit">' + ic('file-text', 'cor-azul') + (cnh ? 'CNH' : 'CRLV') + '</div>' +
      '<span class="' + s[1] + '">' + ic(s[2], 'ic-sm') + s[0] + '</span></div><div class="card-corpo">';
    h += '<div data-ext="' + tipo + '"></div>';
    if (somenteLeitura) {
      h += '<div class="info-box"><div>' + (cnh ? 'Número: ' + esc(m.cnh_numero || '-') + ' &nbsp; Categoria: ' + esc(m.cnh_categoria || '-') : 'RENAVAM: ' + esc(m.crlv_renavam || '-')) + '</div>' +
        '<div>Validade: ' + (val ? fmtDiaChave(String(val).slice(0, 10)) : '-') + '</div></div>' + textoDias(val);
    } else {
      h += '<div class="campo"><label>' + (cnh ? 'Número da CNH' : 'RENAVAM') + '</label><input class="inp" data-c="' + (cnh ? 'cnh_numero' : 'crlv_renavam') + '" value="' + esc(cnh ? m.cnh_numero : m.crlv_renavam) + '" placeholder="' + (cnh ? 'Digite o número da CNH' : 'Digite o RENAVAM') + '"></div>';
      if (cnh) h += '<div class="campo"><label>Categoria</label><input class="inp" data-c="cnh_categoria" value="' + esc(m.cnh_categoria) + '" placeholder="Ex: B, C, D, E"></div>';
      h += '<div class="campo"><label>Data de Validade</label><input type="date" class="inp" data-c="' + tipo + '_validade" value="' + esc(String(val || '').slice(0, 10)) + '">' + textoDias(val) + '</div>';
    }
    if (temArq) h += '<div class="linha mb12"><button class="btn btn-sm btn-contorno cresce" data-ver="' + tipo + '">' + ic('eye', 'ic-sm') + 'Visualizar</button><button class="btn btn-sm btn-contorno cresce" data-baixar="' + tipo + '">' + ic('download', 'ic-sm') + 'Baixar</button></div><div data-prev="' + tipo + '"></div>';
    if (!somenteLeitura) {
      h += '<div class="zona-upload" data-zona="' + tipo + '">' + ic('upload', 'ic-lg') + '<p class="negrito txt-sm mt8">Arraste e solte ou clique para selecionar</p><p class="txt-xs">PDF ou imagens (JPG, PNG) — os dados são lidos automaticamente</p></div>' +
        '<input type="file" accept="image/*,.pdf" class="oculto" data-inp="' + tipo + '"><div data-prog="' + tipo + '"></div>';
      if (temArq && val) h += '<div class="linha mt12" style="border-top:1px solid var(--borda);padding-top:12px"><button class="btn btn-sm cresce ' + (apr ? 'btn-contorno-verde' : 'btn-contorno') + '" data-apr="' + tipo + '">' + ic('check-circle', 'ic-sm') + (apr ? 'Aprovado' : 'Aprovar') + '</button>' +
        '<button class="btn btn-sm cresce ' + (!apr ? 'btn-contorno-verm' : 'btn-contorno') + '" data-rep="' + tipo + '">' + ic('x-circle', 'ic-sm') + 'Reprovar</button></div>';
    }
    return h + '</div></div>';
  };
  cont.innerHTML = '<div class="grade2">' + card('cnh') + card('crlv') + '</div>' +
    (somenteLeitura ? '' : '<button class="btn btn-azul btn-bloco mt16" id="dSalvar">' + ic('save') + 'Salvar dados dos documentos</button>');
  icones();

  const atualizar = function (novo) { m = novo; if (aoMudar) aoMudar(novo); painelDocumentos(cont, novo, aoMudar, somenteLeitura); };
  const arquivoDe = function (tipo) {
    const id = m[tipo + '_documento_id'];
    if (id) return carregarArquivo(id);
    return Promise.resolve({ url: m[tipo + '_documento_url'] });
  };
  cont.querySelectorAll('[data-ver]').forEach(function (b) {
    b.onclick = function () {
      const tipo = b.dataset.ver, box = cont.querySelector('[data-prev="' + tipo + '"]');
      if (box.innerHTML) { box.innerHTML = ''; return; }
      box.innerHTML = '<div class="spinner mb12"></div>';
      arquivoDe(tipo).then(function (a) {
        const url = a.url || dataUrlParaBlobUrl(a);
        const pdf = a.mime ? a.mime === 'application/pdf' : /\.pdf($|\?)/i.test(url);
        box.innerHTML = '<div class="mb12" style="border:2px solid var(--borda);border-radius:10px;overflow:hidden">' +
          (pdf ? '<iframe src="' + url + '" style="width:100%;height:400px;border:0"></iframe>' : '<img src="' + (a.dataUrl || url) + '" style="width:100%;max-height:400px;object-fit:contain;background:var(--s50)">') + '</div>';
      }).catch(function (e) { box.innerHTML = ''; erro(e); });
    };
  });
  cont.querySelectorAll('[data-baixar]').forEach(function (b) {
    b.onclick = function () {
      const tipo = b.dataset.baixar;
      arquivoDe(tipo).then(function (a) {
        if (a.url) { window.open(a.url, '_blank'); return; }
        const link = document.createElement('a'); link.href = dataUrlParaBlobUrl(a); link.download = a.nome || (tipo + '.pdf');
        document.body.appendChild(link); link.click(); link.remove();
      }).catch(erro);
    };
  });
  if (somenteLeitura) return;

  const enviar = function (tipo, file) {
    if (!file) return;
    if (file.type !== 'application/pdf' && file.type.indexOf('image/') !== 0) { toast('Apenas imagens e PDFs são permitidos', 'erro'); return; }
    if (file.size > 10 * 1024 * 1024) { toast('Arquivo muito grande (máx. 10 MB)', 'erro'); return; }
    const prog = cont.querySelector('[data-prog="' + tipo + '"]');
    const barra = function (p, txt) { prog.innerHTML = '<div class="linha-entre txt-xs txt2 mt8"><span>' + txt + '</span><span>' + p + '%</span></div><div class="barra mt8"><div style="width:' + p + '%"></div></div>'; };
    barra(20, 'Preparando arquivo...');
    const ler = file.type.indexOf('image/') === 0 && file.size > 1.5 * 1024 * 1024 ? reduzirImagem(file, 2200, 0.85) : lerDataUrl(file);
    ler.then(function (url) {
      barra(55, 'Enviando e analisando o documento...');
      return api('enviarDocumento', FV.token, m.id, tipo, url, file.name);
    }).then(function (r) {
      barra(100, 'Concluído');
      atualizar(r.motorista);
      const box = cont.querySelector('[data-ext="' + tipo + '"]');
      if (box) box.innerHTML = r.extracao === 'success' ? '<div class="aviso aviso-ok mb12">' + ic('sparkles', 'ic-sm') + '<span class="txt-sm">Dados extraídos! Verifique e edite se necessário.</span></div>'
        : '<div class="aviso aviso-alerta mb12">' + ic('alert-triangle', 'ic-sm') + '<span class="txt-sm">Não foi possível extrair automaticamente. Preencha manualmente.</span></div>';
      icones();
    }).catch(function (e) { prog.innerHTML = ''; erro(e); });
  };
  cont.querySelectorAll('[data-zona]').forEach(function (z) {
    const tipo = z.dataset.zona, inp = cont.querySelector('[data-inp="' + tipo + '"]');
    z.onclick = function () { inp.click(); };
    inp.onchange = function () { enviar(tipo, inp.files[0]); };
    z.ondragover = function (e) { e.preventDefault(); z.classList.add('arrastando'); };
    z.ondragleave = function () { z.classList.remove('arrastando'); };
    z.ondrop = function (e) { e.preventDefault(); z.classList.remove('arrastando'); enviar(tipo, e.dataTransfer.files[0]); };
  });
  cont.querySelectorAll('[data-apr],[data-rep]').forEach(function (b) {
    b.onclick = function () {
      const tipo = b.dataset.apr || b.dataset.rep;
      api('aprovarDocumento', FV.token, m.id, tipo, !!b.dataset.apr).then(atualizar).catch(erro);
    };
  });
  cont.querySelector('#dSalvar').onclick = function () {
    const btn = this; btn.disabled = true;
    const d = {};
    cont.querySelectorAll('[data-c]').forEach(function (i) { d[i.dataset.c] = i.value; });
    api('salvarDocumentos', FV.token, m.id, d).then(function (novo) { toast('Documentos salvos', 'ok'); atualizar(novo); }).catch(function (e) { erro(e); btn.disabled = false; });
  };
}

/* ---------- bloquear ---------- */
function listaBloquear(cont) {
  let lista = [], busca = '';
  cont.innerHTML = '<div class="grade2" style="align-items:start"><div class="card"><div class="card-cab"><div><div class="card-tit">' + ic('user-x', 'cor-verm') + 'Bloquear Motorista</div>' +
    '<div class="card-sub">Pesquise e bloqueie motoristas do sistema</div></div></div><div class="card-corpo"><div class="inp-ico mb12">' + ic('search') +
    '<input class="inp" id="bBusca" placeholder="Buscar por nome ou CPF..."></div><div id="bLivres"><div class="spinner"></div></div></div></div>' +
    '<div class="card"><div class="card-cab"><div class="card-tit">' + ic('shield-off', 'cor-verm') + 'Motoristas Bloqueados <span class="tag tag-verm" id="bQtd">0</span></div></div><div class="card-corpo" id="bBloq"></div></div></div>';
  icones();
  const desenhar = function () {
    const t = busca.toLowerCase(), d = soDigitos(busca);
    const livres = lista.filter(function (m) { return !m.bloqueado && (String(m.nome_completo).toLowerCase().indexOf(t) > -1 || (d && String(m.cpf).indexOf(d) > -1)); });
    const bloq = lista.filter(function (m) { return m.bloqueado; });
    const linha = function (m, bloqueado) {
      return '<div class="lista-mot' + (bloqueado ? ' item-bloq' : '') + '"><div class="cresce"><div class="negrito">' + esc(m.nome_completo) + '</div>' +
        '<div class="meta"><span>' + maskCPF(m.cpf) + '</span><span>' + ic('truck', 'ic-sm') + esc(fmtPlaca(m.placa) || 'Sem placa') + '</span></div>' +
        (bloqueado && m.motivo_bloqueio ? '<div class="txt-xs cor-verm mt8">Motivo: ' + esc(m.motivo_bloqueio) + '</div>' : '') + '</div>' +
        (bloqueado ? '<button class="btn btn-sm btn-contorno-verde" data-desb="' + m.id + '">' + ic('shield-check', 'ic-sm') + 'Desbloquear</button>'
          : '<button class="btn btn-sm btn-contorno-verm" data-bloq="' + m.id + '">' + ic('shield-off', 'ic-sm') + 'Bloquear</button>') + '</div>';
    };
    cont.querySelector('#bLivres').innerHTML = livres.length ? livres.map(function (m) { return linha(m, false); }).join('') : '<div class="vazio">' + ic('user') + '<p>Nenhum motorista encontrado</p></div>';
    cont.querySelector('#bBloq').innerHTML = bloq.length ? bloq.map(function (m) { return linha(m, true); }).join('') : '<div class="vazio">' + ic('shield-check') + '<p>Nenhum motorista bloqueado</p></div>';
    cont.querySelector('#bQtd').textContent = bloq.length;
    icones();
    cont.querySelectorAll('[data-bloq]').forEach(function (b) {
      b.onclick = function () {
        const m = lista.find(function (x) { return x.id === b.dataset.bloq; });
        const md = abrirModal({ titulo: 'Bloquear ' + m.nome_completo, icone: 'shield-off',
          html: '<p class="txt-sm txt2 mb12">O motorista não conseguirá entrar na fila enquanto estiver bloqueado.</p><div class="campo"><label>Motivo (opcional)</label><textarea class="inp" id="bMot" placeholder="Ex.: documento vencido"></textarea></div>' +
            '<div class="linha" style="justify-content:flex-end"><button class="btn btn-contorno" data-n>Cancelar</button><button class="btn btn-verm" data-s>' + ic('shield-off', 'ic-sm') + 'Bloquear</button></div>' });
        md.corpo.querySelector('[data-n]').onclick = md.fechar;
        md.corpo.querySelector('[data-s]').onclick = function () {
          this.disabled = true;
          api('bloquearMotorista', FV.token, m.id, true, md.corpo.querySelector('#bMot').value).then(function (novo) {
            Object.assign(m, novo); md.fechar(); desenhar(); toast('Motorista bloqueado', 'ok');
          }).catch(erro);
        };
      };
    });
    cont.querySelectorAll('[data-desb]').forEach(function (b) {
      b.onclick = function () {
        b.disabled = true;
        const m = lista.find(function (x) { return x.id === b.dataset.desb; });
        api('bloquearMotorista', FV.token, m.id, false, '').then(function (novo) { Object.assign(m, novo); desenhar(); toast('Motorista desbloqueado', 'ok'); }).catch(erro);
      };
    });
  };
  cont.querySelector('#bBusca').oninput = function () { busca = this.value; desenhar(); };
  const tela = FV.tela;
  api('listarMotoristas', FV.token).then(function (l) { if (!telaAtual(tela)) return; lista = l; desenhar(); }).catch(function (e) { if (telaAtual(tela)) erro(e); });
}

function telaDeletar(c) {
  let lista = [], busca = '';
  c.innerHTML = '<div class="card"><div class="card-cab"><div><div class="card-tit">' + ic('trash-2', 'cor-verm') + 'Deletar Motoristas</div>' +
    '<div class="card-sub">Remova motoristas cadastrados do sistema (ação irreversível)</div></div></div><div class="card-corpo">' +
    '<div class="inp-ico mb12">' + ic('search') + '<input class="inp" id="xBusca" placeholder="Buscar por nome ou CPF..."></div><div id="xLista"><div class="spinner"></div></div></div></div>';
  icones();
  const desenhar = function () {
    const t = busca.toLowerCase(), d = soDigitos(busca);
    const fil = lista.filter(function (m) { return String(m.nome_completo).toLowerCase().indexOf(t) > -1 || (d && String(m.cpf).indexOf(d) > -1); });
    const el = c.querySelector('#xLista');
    el.innerHTML = fil.length ? fil.map(function (m) {
      return '<div class="lista-mot"><div class="linha cresce">' + avatarMot(m) + '<div class="cresce"><div class="linha" style="gap:6px"><span class="negrito">' + esc(m.nome_completo) + '</span>' + (m.bloqueado ? '<span class="tag tag-verm">Bloqueado</span>' : '') + '</div>' +
        '<div class="meta"><span>' + fmtCPF(m.cpf) + '</span><span>' + ic('truck', 'ic-sm') + esc(fmtPlaca(m.placa) || 'Sem placa') + '</span><span class="tag tag-borda">' + esc(m.regime) + '</span></div></div></div>' +
        '<button class="btn btn-sm btn-contorno-verm" data-del="' + m.id + '">' + ic('trash-2', 'ic-sm') + 'Deletar</button></div>';
    }).join('') : '<div class="vazio">' + ic('user') + '<p>Nenhum motorista encontrado</p></div>';
    icones(); carregarAvatares(el, lista);
    el.querySelectorAll('[data-del]').forEach(function (b) { b.onclick = function () { dialogoExcluir(lista.find(function (m) { return m.id === b.dataset.del; }), function () { lista = lista.filter(function (m) { return m.id !== b.dataset.del; }); desenhar(); }); }; });
  };
  c.querySelector('#xBusca').oninput = function () { busca = this.value; desenhar(); };
  const tela = FV.tela;
  api('listarMotoristas', FV.token).then(function (l) { if (!telaAtual(tela)) return; lista = l; desenhar(); }).catch(function (e) { if (telaAtual(tela)) erro(e); });
}

function dialogoExcluir(m, aoExcluir) {
  const md = abrirModal({ titulo: '⚠️ ATENÇÃO: Ação Irreversível', fixo: true, html: '<div class="spinner"></div>' });
  api('infoExclusao', FV.token, m.id).then(function (info) {
    md.corpo.innerHTML = '<div class="info-box mb12"><div class="negrito">' + esc(m.nome_completo) + '</div><div class="txt-sm txt2">' + fmtCPF(m.cpf) + ' · ' + esc(fmtPlaca(m.placa) || 'Sem placa') + '</div></div>' +
      (info.naFila ? '<div class="aviso aviso-alerta mb12">' + ic('clock', 'ic-sm') + '<span class="txt-sm"><b>Atenção:</b> este motorista está na fila agora (' + esc(info.status) + ') e será removido dela.</span></div>' : '') +
      '<p class="txt-sm mb12">Todos os dados de cadastro serão apagados. Os registros de histórico continuam guardados para auditoria.</p>' +
      '<div class="campo"><label>Motivo da exclusão</label><textarea class="inp" id="xMot" placeholder="Descreva o motivo da exclusão para auditoria..."></textarea></div>' +
      '<div class="campo"><label>Digite <b>APAGAR</b> para confirmar</label><input class="inp" id="xConf" placeholder="APAGAR"></div><div id="xErro" class="mb12"></div>' +
      '<div class="linha"><button class="btn btn-contorno cresce" data-n>Cancelar</button><button class="btn btn-verm cresce segurar" id="xBtn" disabled><span class="enche"></span><span style="position:relative">' + ic('trash-2', 'ic-sm') + ' Segure para deletar</span></button></div>';
    icones();
    const conf = md.corpo.querySelector('#xConf'), btn = md.corpo.querySelector('#xBtn'), enche = btn.querySelector('.enche');
    md.corpo.querySelector('[data-n]').onclick = md.fechar;
    conf.oninput = function () { btn.disabled = conf.value !== 'APAGAR'; };
    let t = null, p = 0;
    const soltar = function () { clearInterval(t); t = null; p = 0; enche.style.width = '0'; };
    const segurar = function (e) {
      e.preventDefault();
      if (btn.disabled || t) return;
      t = setInterval(function () {
        p += 5; enche.style.width = p + '%';
        if (p >= 100) {
          soltar(); btn.disabled = true; btn.querySelector('span:last-child').innerHTML = '<span class="spinner pq branco"></span>';
          api('deletarMotorista', FV.token, m.id, md.corpo.querySelector('#xMot').value, conf.value).then(function () {
            toast('Motorista deletado', 'ok'); md.fechar(); if (aoExcluir) aoExcluir();
          }).catch(function (er) { md.corpo.querySelector('#xErro').innerHTML = caixaAviso('error', 'Erro ao deletar motorista: ' + er.message); icones(); btn.disabled = false; btn.querySelector('span:last-child').textContent = 'Segure para deletar'; });
        }
      }, 100);
    };
    ['mousedown', 'touchstart'].forEach(function (ev) { btn.addEventListener(ev, segurar); });
    ['mouseup', 'mouseleave', 'touchend', 'touchcancel'].forEach(function (ev) { btn.addEventListener(ev, soltar); });
  }).catch(function (e) { md.fechar(); erro(e); });
}

function telaRelatorios(c) {

      const x = new Date(agora());

function telaMovimentos(c) {
  carregando(c);

  api('dadosMovimentos', FV.token).then(function (movs) {

      limparGraficos();
      const s = busca.toLowerCase();

        if (!dentroDoPeriodo(m.created_date, periodo)) return false;
        if (tipo !== 'all' && m.tipo_movimento !== tipo) return false;
        if (s && String(m.motorista_nome).toLowerCase().indexOf(s) === -1 && String(m.motorista_cpf).indexOf(soDigitos(s) || '§') === -1 && String(m.motorista_placa || '').toLowerCase().indexOf(s) === -1) return false;
        return true;
      });
      const n = function (t) { return fil.filter(function (m) { return m.tipo_movimento === t; }).length; };
      const porDia = {};
      fil.forEach(function (m) { const k = chaveDia(m.created_date); porDia[k] = (porDia[k] || 0) + 1; });
      const diasK = Object.keys(porDia).sort().slice(-30);
      const dist = Object.keys(TIPOS_MOV).map(function (t) { return [t, n(t)]; }).filter(function (x) { return x[1] > 0; });
      const cont = {};
